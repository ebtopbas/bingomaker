[project]
name = "bingomaker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipython>=9.17.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "reportlab>=5.0.1",
    "textual>=8.2.8",
]

[project.scripts]
bingomaker = "bingomaker:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "ty>=0.0.79",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (likely bugs / footguns)
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PTH", # prefer pathlib over os.path
    "RUF", # ruff-specific rules
]
